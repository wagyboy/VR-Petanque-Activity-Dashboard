name: Validate README and preview

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate actual README markers
        run: python scripts/update_readme.py --validate-only
      - name: Preview default-branch activity using proposed code
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/update_readme.py --preview --ref "$DEFAULT_BRANCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: readme-preview
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
